{# Loaded from the FAQ API (/api/faqs/), which reads the FAQ table. #}
<div data-faq-api="{% url 'api:faqs' %}">
  <div class="faq-tools">
    <input class="input" type="search" placeholder="Search FAQs, e.g. refund, warranty, UPI" aria-label="Search FAQs" data-faq-search>
    <div class="chips" data-faq-categories></div>
  </div>
  <div class="two-col" data-faq-results aria-live="polite">
    <div class="faq-empty">Loading FAQs…</div>
  </div>
  <noscript><p class="muted">Turn on JavaScript to see the FAQs, or ask our assistant.</p></noscript>
</div>
