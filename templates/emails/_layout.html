<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ STORE_NAME }}</title></head>
<body style="margin:0;padding:0;background:#f4f4f2;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#1a1a1a;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f2;padding:24px 12px;">
<tr><td align="center">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;">
    <tr><td style="background:#1a1a1a;padding:18px 24px;">
      <span style="display:inline-block;border:2px solid #c9a24a;color:#c9a24a;font-weight:800;font-size:18px;letter-spacing:2px;padding:4px 8px;">MJ</span>
      <span style="color:#ffffff;font-size:12px;letter-spacing:3px;text-transform:uppercase;margin-left:10px;">{% block kicker %}{% endblock %}</span>
    </td></tr>
    <tr><td style="padding:28px 24px 8px;">{% block body %}{% endblock %}</td></tr>
    <tr><td style="padding:16px 24px 24px;color:#777;font-size:12px;border-top:1px solid #eee;">
      {% block footer %}{{ STORE_NAME }} · smarter shopping with AI{% endblock %}
    </td></tr>
  </table>
</td></tr>
</table>
</body>
</html>
