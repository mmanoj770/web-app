<div class="steps" aria-label="Checkout progress">
  <div class="step {% if step > 1 %}done{% elif step == 1 %}current{% endif %}"><span class="num">{% if step > 1 %}<i class="bi bi-check"></i>{% else %}1{% endif %}</span> Address</div>
  <span class="step-line"></span>
  <div class="step {% if step > 2 %}done{% elif step == 2 %}current{% endif %}"><span class="num">{% if step > 2 %}<i class="bi bi-check"></i>{% else %}2{% endif %}</span> Payment</div>
  <span class="step-line"></span>
  <div class="step {% if step == 3 %}done{% endif %}"><span class="num">{% if step == 3 %}<i class="bi bi-check"></i>{% else %}3{% endif %}</span> Confirmation</div>
</div>
