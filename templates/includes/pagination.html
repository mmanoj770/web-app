{% if page.has_other_pages %}
<nav class="row mt-3" style="justify-content: center" aria-label="Pages">
  {% if page.has_previous %}
    <a class="btn btn-white btn-sm" href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page.previous_page_number }}"><i class="bi bi-chevron-left"></i> Previous</a>
  {% endif %}
  <span class="small muted">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}
    <a class="btn btn-white btn-sm" href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page.next_page_number }}">Next <i class="bi bi-chevron-right"></i></a>
  {% endif %}
</nav>
{% endif %}
