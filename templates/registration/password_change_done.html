{% extends "base.html" %}
{% block title %}Password changed · {{ STORE_NAME }}{% endblock %}
{% block content %}
<div class="card empty">
  <i class="bi bi-shield-check"></i>
  <h2>Your password has been changed</h2>
  <p class="muted">Use your new password next time you sign in.</p>
  <a class="btn btn-primary" href="{% url 'accounts:profile' %}">Back to your account</a>
</div>
{% endblock %}
