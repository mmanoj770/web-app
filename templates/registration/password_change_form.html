{% extends "base.html" %}
{% block title %}Change password · {{ STORE_NAME }}{% endblock %}
{% block content %}
<div class="auth">
  <div class="panel">
    <h1>Change password</h1>
    <p class="center muted">Use at least 8 characters, and not one you use elsewhere.</p>
    <form method="post" class="mt-3">
      {% csrf_token %}
      {% include "includes/form_fields.html" %}
      <button class="btn btn-primary btn-lg btn-block" type="submit">Change password</button>
    </form>
  </div>
</div>
{% endblock %}
